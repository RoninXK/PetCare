# Configuração das ferramentas de qualidade do PetCare.
# O projeto não é distribuído como pacote; este arquivo contém apenas
# a configuração do pytest, do pytest-cov e do Ruff.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
# E/W: pycodestyle | F: Pyflakes | I: ordenação de imports
# B: flake8-bugbear (erros prováveis) | UP: pyupgrade (sintaxe moderna)
# A: flake8-builtins (nomes que escondem funções do Python)
# S: flake8-bandit (problemas de segurança, como debug=True)
select = ["E", "W", "F", "I", "B", "UP", "A", "S"]

[tool.ruff.lint.per-file-ignores]
# assert é o jeito normal de verificar resultados no pytest
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
